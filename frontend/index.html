<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能客服</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:#f0f2f5;display:flex;height:100vh;color:#333}
.sidebar{width:240px;background:#1a1a2e;color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.sidebar-header{padding:16px 18px;border-bottom:1px solid #16213e}
.sidebar-header h2{font-size:16px;font-weight:600}
.sidebar-header p{font-size:11px;color:#8899aa;margin-top:2px}
.nav-btn{display:flex;align-items:center;gap:8px;padding:10px 18px;cursor:pointer;font-size:13px;color:#ccd;transition:background .15s;border:none;background:none;width:100%;text-align:left}
.nav-btn:hover{background:#16213e}
.nav-btn.active{background:#0f3460;color:#fff;border-left:3px solid #e94560}
.nav-btn .icon{font-size:16px}
.filter-tabs{display:flex;padding:6px 12px 0;gap:4px}
.filter-tab{padding:3px 10px;border-radius:12px;font-size:11px;background:transparent;color:#8899aa;border:1px solid #2a2a4a;cursor:pointer;transition:all .2s}
.filter-tab:hover{background:#16213e;color:#ccd}
.filter-tab.active{background:#0f3460;color:#fff;border-color:#0f3460}
.session-list{flex:1;overflow-y:auto;padding:4px 8px 8px}
.session-group-label{font-size:11px;color:#667788;padding:10px 12px 4px;font-weight:500}
.session-item{padding:9px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;font-size:13px;color:#ccd;transition:background .2s}
.session-item:hover{background:#16213e}
.session-item.active{background:#0f3460;color:#fff}
.session-item .s-time{font-size:11px;color:#667788}
.s-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del-btn{float:right;font-size:14px;cursor:pointer;opacity:0;transition:opacity .2s;background:none;border:none;color:#99a;padding:0 2px}
.session-item:hover .del-btn{opacity:.6}
.del-btn:hover{opacity:1!important;color:#e94560!important}

/* 主区域 */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-header{padding:12px 20px;background:#fff;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;gap:10px}
.chat-header h3{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memory-indicator{font-size:11px;color:#999;background:#f5f5f5;padding:2px 8px;border-radius:10px;white-space:nowrap}
.status-dot{width:8px;height:8px;border-radius:50%;background:#52c41a;display:inline-block;flex-shrink:0}

/* 消息 */
.messages{flex:1;overflow-y:auto;padding:16px 20px;background:#f7f8fa}
.msg{margin-bottom:16px;display:flex;gap:10px}
.msg.user{flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.msg.user .msg-avatar{background:#e94560;color:#fff}
.msg.bot .msg-avatar{background:#0f3460;color:#fff}
.msg-bubble{max-width:75%;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.65;word-break:break-word}
.msg.user .msg-bubble{background:#e94560;color:#fff;border-bottom-right-radius:3px}
.msg.bot .msg-bubble{background:#fff;color:#333;border-bottom-left-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.msg-time{font-size:11px;color:#aaa;margin-top:3px}
.msg.user .msg-time{text-align:right}
.msg-bubble h1,.msg-bubble h2,.msg-bubble h3{margin:6px 0 3px;font-weight:600}
.msg-bubble h1{font-size:16px}.msg-bubble h2{font-size:15px}.msg-bubble h3{font-size:14px}
.msg-bubble p{margin:3px 0}
.msg-bubble ul,.msg-bubble ol{padding-left:18px;margin:3px 0}
.msg-bubble code{background:#f0f2f5;padding:1px 5px;border-radius:3px;font-size:13px}
.msg-bubble pre{background:#1a1a2e;color:#e6e6e6;padding:10px 14px;border-radius:8px;overflow-x:auto;margin:5px 0;font-size:13px}
.msg-bubble pre code{background:none;padding:0;color:inherit}
.msg-bubble table{border-collapse:collapse;margin:5px 0;font-size:13px;width:100%;display:block;overflow-x:auto}
.msg-bubble th,.msg-bubble td{border:1px solid #ddd;padding:5px 8px;text-align:left}
.msg-bubble th{background:#f8f9fa;font-weight:600}
.msg-bubble img{max-width:100%;border-radius:6px;margin:4px 0}
.sources{margin-top:5px;padding-top:5px;border-top:1px solid #eee}
.source-item{font-size:12px;color:#888;padding:1px 0}
.follow-ups{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.follow-up-chip{padding:3px 10px;border-radius:10px;background:#f0f2f5;color:#0f3460;font-size:12px;cursor:pointer;border:1px solid #d9d9d9;transition:all .2s}
.follow-up-chip:hover{background:#e6f7ff;border-color:#0f3460}
.input-area{padding:12px 20px;background:#fff;border-top:1px solid #e8e8e8;display:flex;gap:10px;align-items:flex-end}
.input-area textarea{flex:1;border:1px solid #d9d9d9;border-radius:8px;padding:8px 12px;font-size:14px;resize:none;outline:none;font-family:inherit;line-height:1.5;min-height:38px;max-height:120px;transition:border-color .2s}
.input-area textarea:focus{border-color:#0f3460}
.input-area button{padding:8px 20px;background:#0f3460;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:500;white-space:nowrap;transition:opacity .2s}
.input-area button:hover{opacity:.85}
.input-area button:disabled{opacity:.35;cursor:not-allowed}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#bbb;font-size:14px}
.empty-state .icon{font-size:40px;margin-bottom:8px}
.typing-indicator{display:flex;gap:4px;padding:3px 0}
.typing-indicator span{width:7px;height:7px;border-radius:50%;background:#bbb;animation:typing 1.4s infinite}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1)}}
.thinking-text{font-size:12px;color:#999}
/* 图表容器 */
.dashboard{padding:20px;overflow-y:auto;background:#f0f2f5}
.dashboard h2{font-size:18px;margin-bottom:16px;color:#1a1a2e}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.kpi-card .label{font-size:12px;color:#888;margin-bottom:4px}
.kpi-card .value{font-size:24px;font-weight:700;color:#1a1a2e}
.kpi-card .sub{font-size:12px;color:#999;margin-top:2px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.chart-box{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.chart-box h3{font-size:14px;font-weight:600;margin-bottom:8px;color:#333}
.chart-box .chart{height:260px}
.chart-full{grid-column:1/-1}
.chart-full .chart{height:300px}
.time-tabs{display:flex;gap:6px;margin-bottom:12px}
.time-tab{padding:4px 14px;border-radius:14px;font-size:12px;cursor:pointer;border:1px solid #d9d9d9;background:#fff;color:#666;transition:all .2s}
.time-tab.active{background:#0f3460;color:#fff;border-color:#0f3460}
.time-tab:hover:not(.active){border-color:#0f3460;color:#0f3460}
.loading-chart{display:flex;align-items:center;justify-content:center;height:260px;color:#bbb;font-size:13px}
@media(max-width:768px){.chart-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header"><h2>充电桩管理</h2><p>AI 客服 · 数据看板</p></div>
  <button class="nav-btn active" onclick="switchView('chat',this)"><span class="icon">💬</span> AI 客服</button>
  <div id="chatSidebar">
    <div class="filter-tabs">
      <span class="filter-tab active" data-filter="all" onclick="setFilter('all',this)">全部</span>
      <span class="filter-tab" data-filter="7d" onclick="setFilter('7d',this)">近7天</span>
      <span class="filter-tab" data-filter="30d" onclick="setFilter('30d',this)">近30天</span>
    </div>
    <div class="session-list" id="sessionList"></div>
  </div>
</div>

<div class="main">
  <div class="chat-header">
      <span class="status-dot"></span>
      <h3 id="currentTitle">新对话</h3>
      <span class="memory-indicator" id="memoryIndicator"></span>
    </div>
    <div class="messages" id="messageList"><div class="empty-state"><div class="icon">💬</div><div>输入问题开始对话</div></div></div>
    <div class="input-area">
      <textarea id="inputBox" rows="1" placeholder="输入您的问题..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8000/api/v1';
let currentSessionId = null, sessions = [], loading = false, filterMode = 'all', isNewSession = true;

// ══════════════════ Chart Render ══════════════════
// (inline chart rendering in chat bubbles - see renderChart in renderMsg)

// ══════════════════ Markdown ══════════════════
function renderMarkdown(t) {
  if (!t) return '';
  let h = t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const blocks = [];
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>{const i=blocks.length;blocks.push(`<pre><code>${esc(c.trim())}</code></pre>`);return `%%CB${i}%%`;});
  h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h = h.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" style="max-width:100%;border-radius:6px;margin:4px 0" loading="lazy" onerror="this.outerHTML=\'<span style=color:#e94560>\\uD83D\\uDDBC\\uFE0F 图片加载失败</span>\'">');
  h = h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h = h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h = h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h = h.replace(/^---$/gm,'<hr>');
  h = h.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
  h = h.replace(/^[-*] (.+)$/gm,'<li>$1</li>');
  h = h.replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>');
  h = h.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  h = h.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  h = h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h = h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  h = h.replace(/\n/g,'<br>');
  h = h.replace(/<\/[hH]>\n?<br>/g,'</h1>');
  h = h.replace(/%%CB(\d+)%%/g,(_,i)=>blocks[i]||'');
  return h;
}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ══════════════════ Sessions ══════════════════
async function loadSessions() {
  try{const r=await fetch(`${API}/sessions?user_id=web`);if(!r.ok)return;const d=await r.json();sessions=d.items||[];renderSessions()}catch(e){}
}
function getTimeGroup(ds){const d=new Date(ds),diff=Math.floor((Date.now()-d)/864e5);if(diff<1)return'今天';if(diff<7)return'最近7天';if(diff<30)return'最近30天';return'更早'}
function renderSessions(){const el=document.getElementById('sessionList');let f=sessions;const n=Date.now();if(filterMode==='7d')f=sessions.filter(s=>n-new Date(s.updated_at||s.created_at).getTime()<6048e5);else if(filterMode==='30d')f=sessions.filter(s=>n-new Date(s.updated_at||s.created_at).getTime()<2592e6);if(!f.length){el.innerHTML='<div style="color:#667;text-align:center;padding:30px;font-size:13px;">暂无对话记录</div>';return}
  const g={};f.forEach(s=>{const gr=getTimeGroup(s.updated_at||s.created_at);if(!g[gr])g[gr]=[];g[gr].push(s)});
  const o=['今天','最近7天','最近30天','更早'];let html='';o.forEach(gr=>{if(!g[gr])return;html+=`<div class="session-group-label">${gr}</div>`;g[gr].forEach(s=>{
    const a=s.id===currentSessionId?' active':'';const t=s.title&&s.title!=='新对话'?s.title:'新对话';const d2=new Date(s.updated_at||s.created_at);const ts=`${d2.getMonth()+1}/${d2.getDate()} ${String(d2.getHours()).padStart(2,'0')}:${String(d2.getMinutes()).padStart(2,'0')}`;
    html+=`<div class="session-item${a}" onclick="switchSession('${s.id}')"><div class="s-title">${esc(t)}</div><div class="s-time">${ts}<button class="del-btn" onclick="event.stopPropagation();deleteSession('${s.id}')">✕</button></div></div>`;
  })});el.innerHTML=html;
}
function setFilter(m,el){filterMode=m;document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');renderSessions()}
async function newChat(){currentSessionId=crypto.randomUUID();isNewSession=true;document.getElementById('currentTitle').textContent='新对话';document.getElementById('memoryIndicator').textContent='';document.getElementById('messageList').innerHTML='<div class="empty-state"><div class="icon">💬</div><div>输入问题开始对话</div></div>';document.getElementById('inputBox').value='';renderSessions()}
async function switchSession(id){if(isNewSession&&currentSessionId){const f=document.querySelector('#messageList .msg .msg-bubble');if(f){try{await fetch(`${API}/sessions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:currentSessionId,title:f.textContent.trim().slice(0,50),user_id:'web'})})}catch(e){}}}
  currentSessionId=id;isNewSession=false;renderSessions();await loadMessages(id)}
async function deleteSession(id){try{await fetch(`${API}/sessions/${id}`,{method:'DELETE'})}catch(e){}if(currentSessionId===id)newChat();else await loadSessions()}
async function loadMessages(si){try{const r=await fetch(`${API}/sessions/${si}/messages`);if(!r.ok)throw Error();const msgs=await r.json();const el=document.getElementById('messageList');if(!msgs.length){el.innerHTML='<div class="empty-state"><div class="icon">💬</div><div>输入问题开始对话</div></div>';return}
  el.innerHTML=msgs.map(m=>renderMsg(m.role,m.content,safeParse(m.metadata))).join('');el.scrollTop=el.scrollHeight;const t=msgs.find(m=>m.role==='user')?.content?.slice(0,50)||'对话';document.getElementById('currentTitle').textContent=t}catch(e){document.getElementById('messageList').innerHTML='<div class="empty-state"><div class="icon">💬</div><div>输入问题开始对话</div></div>'}}
function safeParse(s){try{return JSON.parse(s||'{}')}catch(e){return{}}}

// ══════════════════ Chat ══════════════════
async function sendMessage(){const input=document.getElementById('inputBox');const text=input.value.trim();if(!text||loading)return;input.value='';autoResize(input);loading=true;document.getElementById('sendBtn').disabled=true
  if(isNewSession){try{await fetch(`${API}/sessions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:currentSessionId,title:text.slice(0,50),user_id:'web'})})}catch(e){}isNewSession=false}
  const el=document.getElementById('messageList');const empty=el.querySelector('.empty-state');if(empty)el.innerHTML='';el.insertAdjacentHTML('beforeend',renderMsg('user',text))
  const mid='lmsg';el.insertAdjacentHTML('beforeend',`<div class="msg bot" id="${mid}"><div class="msg-avatar">AI</div><div class="msg-bubble"><div class="typing-indicator"><span></span><span></span><span></span></div><div class="thinking-text">思考中...</div></div></div>`);el.scrollTop=el.scrollHeight
  try{const r=await fetch(`${API}/chat/completions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:currentSessionId,message:text,user_id:'web'})});document.getElementById(mid)?.remove();if(!r.ok)throw Error();const d=await r.json()
    el.insertAdjacentHTML('beforeend',renderMsg('assistant',d.answer,{sources:d.sources||[],follow_ups:d.follow_up_questions||[],chart_config:d.chart_config||null}));el.scrollTop=el.scrollHeight;document.getElementById('currentTitle').textContent=text.slice(0,50);if(d.fact_count>0)document.getElementById('memoryIndicator').textContent='🧠 '+d.fact_count+'条记忆';await loadSessions()
  }catch(e){document.getElementById(mid)?.remove();el.insertAdjacentHTML('beforeend',renderMsg('assistant','抱歉，我遇到了问题，请稍后再试。'));el.scrollTop=el.scrollHeight}finally{loading=false;document.getElementById('sendBtn').disabled=false}
}
function renderMsg(role,content,meta={}){const u=role==='user';const b=u?esc(content).replace(/\n/g,'<br>'):renderMarkdown(content);let x='',chartId=''
  if(meta.chart_config){chartId='chart-'+(Math.random()*1e6|0);x+=`<div id="${chartId}" style="width:100%;height:240px;margin:8px 0"></div>`}
  if(meta.sources?.length){x+='<div class="sources">';meta.sources.forEach(s=>{if(!s.doc_name||s.doc_name.startsWith('API:'))return;x+=`<div class="source-item">📄 ${esc(s.doc_name)}</div>`});x+='</div>'}
  if(meta.follow_ups?.length){x+='<div class="follow-ups">';meta.follow_ups.forEach(q=>{x+=`<span class="follow-up-chip" onclick="useFollowUp('${esc(q)}')">${esc(q)}</span>`});x+='</div>'}
  const t=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  const html=`<div class="msg ${u?'user':'bot'}"><div class="msg-avatar">${u?'我':'AI'}</div><div><div class="msg-bubble">${b}${x}</div><div class="msg-time">${t}</div></div></div>`;
  // 异步渲染图表
  if(chartId&&meta.chart_config){setTimeout(()=>renderChart(chartId,meta.chart_config),100)}
  return html
}
function renderChart(domId,cfg){
  const dom=document.getElementById(domId);if(!dom){console.warn('Chart DOM not found:',domId);return}
  if(typeof echarts==='undefined'){dom.innerHTML='<div style="padding:20px;text-align:center;color:#999">📊 图表库加载中...</div>';return}
  try{
    const chart=echarts.init(dom);
    const opt=JSON.parse(JSON.stringify(cfg)); // 深拷贝，避免冻结对象问题
    if(opt.type==='line'&&opt.keys&&opt.keys.length){
      chart.setOption({
        tooltip:{trigger:'axis'},grid:{left:'8%',right:'5%',bottom:'15%',top:'8%',containLabel:true},
        xAxis:{type:'category',data:opt.keys,axisLabel:{rotate:30,fontSize:11}},
        yAxis:{type:'value',splitLine:{lineStyle:{type:'dashed',color:'#eee'}}},
        series:[{type:'line',data:opt.values||[],smooth:true,
          lineStyle:{width:2,color:opt.color||'#0f3460'},
          areaStyle:{color:(opt.color||'#0f3460')+'30'},
          symbol:'circle',symbolSize:5,itemStyle:{color:opt.color||'#0f3460'}}]
      });
    }else if(opt.type==='pie'&&opt.data){
      chart.setOption({tooltip:{trigger:'item',formatter:'{b}: {c} ({d}%)'},
        series:[{type:'pie',radius:['40%','70%'],data:opt.data,label:{fontSize:12}}]});
    }
    window.addEventListener('resize',()=>chart.resize());
  }catch(e){console.error('Chart render error:',e);dom.innerHTML='<div style="padding:20px;text-align:center;color:#999">📊 图表渲染失败</div>'}
}
function useFollowUp(t){document.getElementById('inputBox').value=t;autoResize(document.getElementById('inputBox'));sendMessage()}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}

// Init
document.addEventListener('DOMContentLoaded',()=>{loadSessions()});
</script>
</body>
</html>
