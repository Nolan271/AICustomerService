# Nginx 配置示例 — 同域反向代理（推荐方案）
#
# 将以下 location 块加入你 PHP 站点已有的 Nginx server block 中。
# 这样前端 JS 请求 /ai-api/ 时实际转发到 Python FastAPI 服务，
# 不存在跨域问题，Cookie 也会自动透传。
#
# 用途: AI 客服服务 / PHP 站点 = 同域
# 效果: 用户访问 https://app.com/widget.js → 你的静态目录
#        JS 请求 https://app.com/ai-api/api/v1/chat/completions → Python:8000

server {
    listen 443 ssl;
    server_name app.com;

    # ... 你已有的 PHP 配置 ...

    # ── 1. 服务 Widget JS 文件 ──────────────────────────────────
    # 把 widget.js 放在 PHP 项目的 static/ 目录，或者从 Python 端代理
    location /ai-widget/ {
        # 方式 A: PHP 项目静态目录
        # alias /path/to/your/php-project/static/ai-widget/;

        # 方式 B: 从 Python 服务代理
        proxy_pass http://127.0.0.1:8000/ai-widget/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── 2. 代理 AI API（核心）────────────────────────────────────
    # JS 请求 /ai-api/api/v1/... 转发到 Python FastAPI
    location /ai-api/ {
        proxy_pass http://127.0.0.1:8000/;   # Python FastAPI

        # 必要的代理头
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';    # 支持 WebSocket
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 透传 Cookie（如果 PHP 和 Python 同域用 session 共享）
        proxy_set_header Cookie $http_cookie;

        # 超时设置（SSE 流式应答需要较长超时）
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 关闭缓冲（SSE 流式必须）
        proxy_buffering off;
        proxy_cache off;
    }

    # ... 你原有的 PHP 路由 ...
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        # ... 你的 FastCGI 配置 ...
    }
}
