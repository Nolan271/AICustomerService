# AiCustomerService — Nginx 生产环境配置
# 部署路径: /home/deploy/AiCustomerService
# 数据路径: /data/

upstream aics_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name 39.107.83.149;  # 替换为你的域名

    # SSL 证书（用 certbot 或自行申请）
    # ssl_certificate /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # API 反向代理
    location /api/v1/ {
        proxy_pass http://aics_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # WebSocket（对话流式接口）
    location /api/v1/chat/ws {
        proxy_pass http://aics_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SSE 流式接口
    location /api/v1/chat/completions/stream {
        proxy_pass http://aics_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 图片静态文件（Nginx 直接返回，不走 Python）
    location /media/images/ {
        alias /usr/share/nginx/media/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # 健康检查
    location /health {
        proxy_pass http://aics_api/api/v1/admin/health;
    }

    # 前端（可选：部署编译好的 H5 页面）
    # location / {
    #     root /usr/share/nginx/html;
    #     index index.html;
    #     try_files $uri $uri/ /index.html;
    # }
}
