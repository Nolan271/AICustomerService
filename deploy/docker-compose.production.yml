# AiCustomerService — 生产环境 Docker Compose
# 数据持久化在 /data/ 目录，项目代码在 /home/deploy/
# 使用方式:
#   docker compose -f deploy/docker-compose.production.yml up -d
#   docker compose -f deploy/docker-compose.production.yml --env-file .env.production up -d

services:

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aics-api
    restart: always
    ports:
      - "8001:8000"
    env_file:
      - ../.env.production
    environment:
      - QDRANT_HOST=qdrant
      - DATABASE_URL=sqlite+aiosqlite:///data/sqlite/app.db
      - MEDIA_DIR=/data/media/images
      - UPLOAD_DIR=/data/uploads
    volumes:
      - /data/sqlite:/data/sqlite
      - /data/uploads:/data/uploads
      - /data/media/images:/data/media/images
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/admin/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aics-net

  qdrant:
    image: docker.m.daocloud.io/qdrant/qdrant:latest
    container_name: aics-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - /data/qdrant/storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - aics-net

  nginx:
    image: docker.m.daocloud.io/library/nginx:alpine
    container_name: aics-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /data/media/images:/usr/share/nginx/media/images:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - aics-net

volumes:
  qdrant_data:

networks:
  aics-net:
    driver: bridge
