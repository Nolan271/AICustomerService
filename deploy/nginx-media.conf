# ────────────────────────────────────────────────
# Nginx 媒体文件配置
# 用途：AI 客服图片直接由 Nginx 伺服，不经过 Python
#
# 使用方法：
#   1. 复制到你的 Nginx 配置目录
#   2. 修改 root 路径为实际的 MEDIA_DIR
#   3. 在 server block 中 include 此文件
#
#   迁移到新服务器时只需改 alias 的路径
# ────────────────────────────────────────────────

# 修改此处为服务器上的实际 MEDIA_DIR 路径
# 默认：./data/media/images（相对于项目根目录）
# 如果是 Docker 部署，改为容器内的路径或挂载卷路径
set $media_root /www/AiCustomerService/data/media/images;

# 图片访问 URL：/media/images/xxx.jpg
# 实际文件：$media_root/xxx.jpg
location /media/images/ {
    alias $media_root/;

    # 图片缓存 30 天，浏览器不会重复请求
    expires 30d;
    add_header Cache-Control "public, immutable, no-transform";

    # 允许跨域（小程序需要）
    add_header Access-Control-Allow-Origin "*";

    # 关闭访问日志（图片请求量大，没必要记日志）
    access_log off;

    # 图片不存在时返回 404 占位图（可选）
    # error_page 404 /media/images/placeholder.png;
}

# ────────────────────────────────────────────────
# 迁移新服务器时需要改的地方（只有这一处）：
#
#   set $media_root /新服务器上的路径;
#
# ────────────────────────────────────────────────
