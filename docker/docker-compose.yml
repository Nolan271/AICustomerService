# AiCustomerService — Docker Compose 编排
# 启动全部服务: docker compose -f docker/docker-compose.yml up -d
# 仅启动 Qdrant:  docker compose -f docker/docker-compose.yml up qdrant -d

services:

  # ── API 服务 ──
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aics-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - QDRANT_HOST=qdrant
      - DATABASE_URL=sqlite+aiosqlite:///data/sqlite/app.db
    volumes:
      - sqlite_data:/app/data/sqlite
      - upload_data:/app/data/uploads
      - /c/Users/muzhi/MinerU:/app/mineru_input:ro    # MinerU 解析结果
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/admin/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aics-net

  # ── Qdrant 向量数据库 ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aics-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - aics-net

  # ── (可选) Ollama 本地 LLM ──
  ollama:
    image: ollama/ollama:latest
    container_name: aics-ollama
    restart: unless-stopped
    profiles:
      - local-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - aics-net

volumes:
  qdrant_data:
  sqlite_data:
  upload_data:
  ollama_models:

networks:
  aics-net:
    driver: bridge
