# AiCustomerService — Docker Compose 开发环境
# 使用方式:
#   启动全部:    docker compose -f docker/docker-compose.yml up -d
#   仅 Qdrant:   docker compose -f docker/docker-compose.yml up qdrant -d
#   停止:        docker compose -f docker/docker-compose.yml down

services:

  # ── API 服务（开发环境） ──
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: aics-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - ../.env
    environment:
      - QDRANT_HOST=qdrant            # Docker 内用 service 名
      - DATABASE_URL=sqlite+aiosqlite:///data/sqlite/app.db
    volumes:
      - sqlite_data:/app/data/sqlite
      - upload_data:/app/data/uploads
      - ../data/media/images:/app/data/media/images
    depends_on:
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/admin/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aics-net

  # ── Qdrant 向量数据库 ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aics-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - aics-net

volumes:
  qdrant_data:
  sqlite_data:
  upload_data:

networks:
  aics-net:
    driver: bridge
